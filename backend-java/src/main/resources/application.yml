server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${SENTINEL_DB_HOST:localhost}:${SENTINEL_DB_PORT:5432}/${SENTINEL_DB_NAME:sentinel}
    username: ${SENTINEL_DB_USER:sentinel}
    password: ${SENTINEL_DB_PASSWORD:sentinel}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${SENTINEL_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${SENTINEL_KAFKA_CONSUMER_GROUP:sentinel-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

sentinel:
  security:
    jwt-secret: ${SENTINEL_JWT_SECRET:sentinel-local-development-secret-change-before-production}
    jwt-expiration-ms: ${SENTINEL_JWT_EXPIRATION_MS:3600000}
    demo-username: ${SENTINEL_DEMO_USERNAME:analyst}
    demo-password: ${SENTINEL_DEMO_PASSWORD:sentinel}
    admin-username: ${SENTINEL_ADMIN_USERNAME:admin}
    admin-password: ${SENTINEL_ADMIN_PASSWORD:sentinel-admin}
    auditor-username: ${SENTINEL_AUDITOR_USERNAME:auditor}
    auditor-password: ${SENTINEL_AUDITOR_PASSWORD:sentinel-audit}
  cors:
    allowed-origins: ${SENTINEL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  kafka:
    topics:
      scored: ${SENTINEL_SCORED_TOPIC:transactions.scored}
      alerts: ${SENTINEL_ALERTS_TOPIC:alerts.generated}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
