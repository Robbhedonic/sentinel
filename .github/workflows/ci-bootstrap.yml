name: ci-bootstrap

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env file
        run: cp infrastructure/docker/.env.example infrastructure/docker/.env
      - name: Validate Docker Compose
        run: docker compose --project-directory infrastructure/docker -f infrastructure/docker/docker-compose.yml config

  build-c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator-c
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential librdkafka-dev
      - name: Build simulator
        run: cmake -S . -B build && cmake --build build

  build-cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-engine-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential librdkafka-dev nlohmann-json3-dev
      - name: Build fraud engine
        run: cmake -S . -B build && cmake --build build
      - name: Run fraud engine tests
        run: ctest --test-dir build --output-on-failure

  build-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build and test backend
        run: mvn -B test package

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package.json
      - name: Install deps
        run: npm install
      - name: Build frontend
        run: npm run build

  test-frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package.json
      - name: Install dependencies
        run: npm install
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend E2E tests
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: frontend-react/test-results/
          if-no-files-found: ignore

  test-full-e2e:
    runs-on: ubuntu-latest
    needs: [validate-compose, build-java]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare compose env
        run: cp infrastructure/docker/.env.example infrastructure/docker/.env
      - name: Run full app E2E
        run: ./scripts/full-e2e.sh

  build-images:
    runs-on: ubuntu-latest
    needs: [validate-compose, build-c, build-cpp, build-java, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t sentinel/backend-java:ci backend-java
      - name: Build frontend image
        run: docker build -t sentinel/frontend-react:ci frontend-react
      - name: Build fraud engine image
        run: docker build -t sentinel/fraud-engine-cpp:ci fraud-engine-cpp

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend dependency audit
        run: npm audit --audit-level=high
        working-directory: frontend-react
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Maven dependency check
        run: mvn -B dependency-check:check -DfailBuildOnCVSS=8
        working-directory: backend-java

  trivy-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: 1

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, java-kotlin
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
