name: ci-bootstrap

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose -f infrastructure/docker/docker-compose.yml config

  build-c:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator-c
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential librdkafka-dev
      - name: Build simulator
        run: cmake -S . -B build && cmake --build build

  build-cpp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fraud-engine-cpp
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - name: Build fraud engine
        run: cmake -S . -B build && cmake --build build

  build-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build backend
        run: mvn -B -DskipTests package

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend-react/package.json
      - name: Install deps
        run: npm install
      - name: Build frontend
        run: npm run build
